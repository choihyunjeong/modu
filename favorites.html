<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>자주 가는 곳 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610222053">
    <link rel="stylesheet" href="css/fav.css?v=2610222053">
    <script src="js/common.js?v=2610222053"></script>
    <script src="js/config.js?v=2610222053"></script>
    <script src="js/trip.js?v=2610222053"></script>
    <script src="js/actions.js?v=2610222053"></script>
    <script src="js/favorites.js?v=2610222053"></script>
</head>
<body>
    <!-- 자주 가는 곳 편집 (검색 화면 "편집"에서) · 집은 수정 · 추가한 곳은 삭제 · 아래 "자주 가는 곳 추가" -->
    <div id="wrap">
        <header class="app-header">
            <a href="search.html" class="app-header__back" data-history-back aria-label="뒤로">
                <span class="icon icon--chevron-left" aria-hidden="true"></span>
            </a>
            <h1 class="app-header__title">자주 가는 곳</h1>
            <span class="app-header__blank" aria-hidden="true"></span>
        </header>

        <main class="content content--sub fav">
            <ul class="fav-list" data-fav-list></ul>
            <p class="fav-empty" data-fav-empty hidden>집 말고도 병원·복지관처럼 자주 가는 곳을 추가해 두면<br>목적지 검색에서 바로 고를 수 있어요.</p>
        </main>

        <div class="bottom-action">
            <a href="fav-add.html" class="btn btn--outline">자주 가는 곳 추가</a>
        </div>
    </div>

    <script>
        var listEl = document.querySelector('[data-fav-list]');
        function esc(text) {
            var div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
        function render() {
            var items = Favorites.list();
            listEl.innerHTML = items.map(function (f) {
                var home = f.type === 'home';
                return '<li class="fav-item">' +
                    '<span class="fav-item__icon fav-item__icon--' + (home ? 'home' : 'star') + '" aria-hidden="true">' +
                        '<span class="icon ' + (home ? 'icon--home' : 'icon--location-star') + '"></span></span>' +
                    '<span class="fav-item__text"><strong class="fav-item__name">' + esc(f.name) + '</strong>' +
                        '<span class="fav-item__addr">' + esc(f.addr) + '</span></span>' +
                    (home
                        ? '<a href="fav-add.html?edit=home" class="fav-item__btn" aria-label="집 주소 수정">수정</a>'
                        : '<button type="button" class="fav-item__btn" data-del="' + f.id + '" aria-label="' + esc(f.name) + ' 삭제">삭제</button>') +
                '</li>';
            }).join('');
            document.querySelector('[data-fav-empty]').hidden = items.length > 1;
        }
        render();

        listEl.addEventListener('click', function (e) {
            var del = e.target.closest('[data-del]');
            if (!del) return;
            var f = Favorites.get(del.dataset.del);
            Actions.openLayer('dialog',
                '<div class="confirm-dialog__head confirm-dialog__head--left">' +
                    '<h2 class="confirm-dialog__title confirm-dialog__title--sm">' + esc(f.name) + '을(를) 삭제할까요?</h2>' +
                    '<p class="confirm-dialog__desc">자주 가는 곳에서만 빠지고, 이용내역은 그대로 남아요.</p>' +
                '</div>' +
                '<div class="confirm-dialog__actions">' +
                    '<button type="button" class="btn btn--outline btn--md" data-keep>취소</button>' +
                    '<button type="button" class="btn btn--outline btn--md fav-danger" data-remove>삭제</button>' +
                '</div>',
                function (box, close) {
                    box.querySelector('[data-keep]').addEventListener('click', function () { close(); });
                    box.querySelector('[data-remove]').addEventListener('click', function () {
                        close(true);
                        Favorites.remove(f.id);
                        render();
                        Toast.show(f.name + '을(를) 삭제했어요', { check: true });
                        document.querySelector('.app-header__title').setAttribute('tabindex', '-1');
                        document.querySelector('.app-header__title').focus();
                    });
                }, del);
        });

        // 추가·수정하고 돌아오면 목록 다시
        window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
    </script>
</body>
</html>
