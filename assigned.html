<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차량 배정 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/progress.css">
    <script src="js/common.js"></script>
    <script src="js/config.js"></script>
    <script src="js/trip.js"></script>
    <script src="js/map.js"></script>
    <script src="js/push.js"></script>
    <script src="js/actions.js"></script>
</head>
<body>
    <div id="wrap" class="map-page" data-auto-next="arriving.html" data-delay="8000" data-next-notice="UD택시가 곧 도착해요"
        data-share-status="UD택시 배정 · 33바 5521 흰색 PV5 · 탑승 위치로 오는 중" data-cancel-desc="배정된 차가 오고 있어요. 취소하면 기사님께 바로 알려드려요.">
        <div class="map-view" style="--map-height: 304px; --map-img-top: -248px;" data-map data-center="pickup" data-level="2" data-fit="car,pickup,me">
            <img class="map-view__static" src="image/map-static.png" alt="">

            <div class="map-me" data-static-pos data-place="me" style="--x: 126px; --y: 15px; --heading: 177deg;">
                <img src="image/map-heading.svg" alt="">
            </div>
            <div class="map-car" data-static-pos data-place="car" data-move-path="approach" data-move-range="0,0.6" data-move-ms="8000" style="--x: 236px; --y: 21px;">
                <img src="image/ud-taxi.png" alt="">
            </div>
            <span class="map-chip map-chip--primary" data-static-pos style="--x: 96px; --y: 54px;">탑승 위치</span>
            <span class="map-chip map-chip--light" data-static-pos style="--x: 268px; --y: 7px;" data-eta-chip>약 8분</span>

            <a href="index.html" class="btn-float btn-float--back" aria-label="홈으로">
                <span class="icon icon--arrow-left" aria-hidden="true"></span>
            </a>
            <button type="button" class="btn-float btn-float--locate" aria-label="내 위치로 이동" data-locate>
                <span class="icon icon--location-current" aria-hidden="true"></span>
            </button>
        </div>

        <section class="sheet sheet--assigned sheet--grouped">
            <span class="sheet__grabber" aria-hidden="true"></span>

            <!-- 요약 · 시간 · 위치 · 인원 -->
            <div class="assigned-group assigned-group--summary">
                <div class="assigned-head">
                    <div class="assigned-head__text">
                        <h1 class="assigned-title" data-eta="title">약 8분 후 도착 예정</h1>
                        <p class="assigned-desc">차량이 배정됐어요</p>
                    </div>
                    <!-- 더보기: 보호자 공유 · 접수 취소 -->
                    <button type="button" class="btn-icon-round" aria-label="더보기" aria-haspopup="dialog"
                        data-action="menu" data-title="더보기" data-options="guardian,call-center,cancel">
                        <span class="icon icon--more" aria-hidden="true"></span>
                    </button>
                </div>

                <div class="info-rows">
                    <p class="pickup-row">
                        <span class="pickup-row__label">
                            <span class="icon icon--sm icon--location" aria-hidden="true"></span>
                            탑승 위치
                        </span>
                        <span class="pickup-row__place" data-trip="pickup-spot">정문 · 경사로 쪽</span>
                    </p>
                    <p class="pickup-row">
                        <span class="pickup-row__label">
                            <span class="icon icon--sm icon--user-multiple" aria-hidden="true"></span>
                            탑승 인원
                        </span>
                        <span class="pickup-row__place" data-trip="riders">본인 + 동승자 1명</span>
                    </p>
                </div>
            </div>

            <!-- 배차 차량 · 안내 · 기사 -->
            <div class="assigned-group">
                <p class="boarding-note">
                    <span class="icon icon--sm icon--information" aria-hidden="true"></span>
                    옆문 경사로가 있는 UD택시가 배차됐어요
                </p>

                <div class="driver-card">
                    <img class="driver-card__photo" src="image/driver.png" alt="">
                    <div class="driver-card__text">
                        <p class="driver-card__plate">33바 5521</p>
                        <p class="driver-card__info">강○○ 기사님 · 흰색 PV5</p>
                    </div>
                    <img class="driver-card__car" src="image/pv5-side.png" alt="">
                </div>
            </div>

            <!-- 연락 · 메시지 · 전화 · 도움 -->
            <div class="assigned-group assigned-group--contact">
                <div class="btn-line-row">
                    <button type="button" class="btn-line" data-action="msg" aria-haspopup="dialog">
                        <span class="icon icon--chat" aria-hidden="true"></span>
                        메시지
                    </button>
                    <button type="button" class="btn-line" data-action="call-driver">
                        <span class="icon icon--phone" aria-hidden="true"></span>
                        전화
                    </button>
                </div>
                <div class="help-row">
                    <button type="button" class="btn-help" aria-haspopup="dialog"
                        data-action="menu" data-title="도움이 필요하세요?" data-desc="필요한 도움을 골라 주세요" data-options="call-center,call-driver,guardian">
                        <span class="icon icon--sm icon--help" aria-hidden="true"></span>
                        도움이 필요해요
                    </button>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
