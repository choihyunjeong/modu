<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 밝은·어두운 화면 둘 다 지원 (다크모드·절전모드면 앱의 어두운 색으로 · 브라우저가 색을 억지로 뒤집지 않음) -->
    <meta name="color-scheme" content="light dark">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>이용내역 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610241240">
    <link rel="stylesheet" href="css/tabs.css?v=2610241240">
    <script src="js/common.js?v=2610241240"></script>
    <script src="js/config.js?v=2610241240"></script>
    <script src="js/trip.js?v=2610241240"></script>
    <script src="js/push.js?v=2610241240"></script>
    <script src="js/stats.js?v=2610241240"></script>
    <script src="js/actions.js?v=2610241240"></script>
</head>
<body>
    <!-- 이용내역 (이동 완료 화면에서 남긴 기록 · 누르면 자세히) -->
    <div id="wrap">
        <header class="tab-page-head">
            <h1 class="tab-page-head__title">이용내역</h1>
        </header>

        <main class="content tab-page">
            <!-- 지금 진행 중인 호출 (있을 때만 · 찾는 중 / 오는 중 / 도착 / 탑승 중) -->
            <section class="live-call" data-live-call hidden aria-live="polite">
                <p class="live-call__label">지금 진행 중</p>
                <a class="live-call__card" href="waiting.html" data-live-link>
                    <span class="live-call__top">
                        <span class="live-call__badge" data-live-badge>찾는 중</span>
                        <span class="live-call__time" data-live-time></span>
                    </span>
                    <span class="live-call__title" data-live-title>차량을 찾고 있어요</span>
                    <span class="live-call__desc" data-live-desc></span>
                    <span class="live-call__route" data-live-route></span>
                    <ol class="live-steps" aria-label="진행 단계" data-live-steps>
                        <li>접수</li><li>배정</li><li>도착</li><li>탑승</li><li>완료</li>
                    </ol>
                    <span class="live-call__go">진행 화면 보기 <span class="icon icon--xs icon--chevron-right" aria-hidden="true"></span></span>
                </a>
            </section>

            <ul class="history-list" data-history></ul>

            <div class="empty-card" data-history-empty hidden>
                <p class="empty-card__title">아직 이용 내역이 없어요</p>
                <p class="empty-card__desc">이동을 마치면 여기에서 다시 볼 수 있어요.</p>
                <a href="search.html" class="btn btn--primary">바로 부르기</a>
            </div>
        </main>

        <nav class="tab-bar" aria-label="주 메뉴">
            <a href="index.html" class="tab-bar__item">
                <span class="icon icon--home" aria-hidden="true"></span>
                홈
            </a>
            <a href="reserve.html" class="tab-bar__item">
                <span class="icon icon--calendar" aria-hidden="true"></span>
                예약
            </a>
            <a href="history.html" class="tab-bar__item is-active" aria-current="page">
                <span class="icon icon--time" aria-hidden="true"></span>
                이용내역
            </a>
            <a href="#" class="tab-bar__item" data-soon="설정 화면">
                <span class="icon icon--settings" aria-hidden="true"></span>
                설정
            </a>
        </nav>
    </div>

    <script>
        var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
        var driver = (window.APP_CONFIG && APP_CONFIG.driver) || {};

        function esc(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function day(time) {
            var d = new Date(time);
            return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
        }
        function hm(time) {
            var d = new Date(time);
            return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        }

        // 지금 진행 중인 호출 (js/push.js Progress · 2초마다 다시 확인)
        var LIVE = {
            waiting: { badge: '찾는 중', tone: 'wait', title: '차량을 찾고 있어요', step: 0 },
            assigned: { badge: '오는 중', title: 'UD택시가 오고 있어요', desc: '약 8분 후 도착 예정', step: 1 },
            arriving: { badge: '곧 도착', title: 'UD택시가 거의 다 왔어요', desc: '약 3분 후 도착 예정', step: 1 },
            arrived: { badge: '도착', title: '차량이 도착했어요', desc: '탑승 위치에 차가 섰어요', step: 2 },
            riding: { badge: '탑승 중', tone: 'ride', title: '목적지로 이동 중이에요', step: 3 }
        };
        var liveBox = document.querySelector('[data-live-call]');
        var liveStage = null;
        function renderLive() {
            var step = window.Progress && Progress.sync();
            var key = step && LIVE[step.stage] ? step.stage : null;
            if (key === liveStage) return;
            liveStage = key;
            liveBox.hidden = !key;
            if (!key) return;
            var s = LIVE[key];
            var t = Trip.get();
            var badge = liveBox.querySelector('[data-live-badge]');
            badge.textContent = s.badge;
            badge.className = 'live-call__badge' + (s.tone ? ' live-call__badge--' + s.tone : '');
            liveBox.querySelector('[data-live-time]').textContent = hm(t.calledAt) + ' 접수';
            liveBox.querySelector('[data-live-title]').textContent = s.title;
            var dest = (t.destination && t.destination.name) || '은평성모병원';
            var desc = key === 'waiting'
                ? (window.WaitStats ? '승차까지 예상 약 ' + WaitStats.forDay().avg + '분' : '')
                : key === 'riding' ? dest + '까지 가고 있어요' : s.desc + ' · ' + ((driver.plate || '') + ' ' + (driver.car || '')).trim();
            liveBox.querySelector('[data-live-desc]').textContent = desc;
            liveBox.querySelector('[data-live-route]').textContent = (t.pickupName || '래미안베라힐즈 정문') + ' → ' + dest;
            liveBox.querySelector('[data-live-link]').href = step.url;
            liveBox.querySelectorAll('[data-live-steps] li').forEach(function (li, i) {
                li.className = i < s.step ? 'is-done' : i === s.step ? 'is-now' : '';
                if (i === s.step) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
            });
        }

        // 이용내역 카드: 날짜 · 운행 시간 · 출발 · 도착 · 금액 / 기사님께 전화 · 탑승 경험 (카드를 누르면 이용 상세)
        var list = document.querySelector('[data-history]');
        var emptyBox = document.querySelector('[data-history-empty]');
        function shortDay(time) {
            var d = new Date(time);
            return String(d.getFullYear()).slice(2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2) + ' (' + DAYS[d.getDay()] + ')';
        }
        function renderList() {
            var items = Trip.history();
            emptyBox.hidden = items.length > 0 || !!liveStage;
            list.innerHTML = items.map(function (r) {
                var detail = 'feedback.html?id=' + r.id;
                var times = r.boardedAt ? hm(r.boardedAt) + ' - ' + hm(r.doneAt) : hm(r.doneAt) + ' 하차';
                var rate = r.rating
                    ? '<a href="' + detail + '" class="history-item__btn is-rated"><span class="history-item__star" aria-hidden="true">★</span> ' + r.rating + '점 · 평가 완료</a>'
                    : '<a href="' + detail + '#rate" class="history-item__btn">탑승 경험 남기기</a>';
                return '<li class="history-item">' +
                    '<div class="history-item__top">' +
                        '<a href="' + detail + '" class="history-item__title">' +
                            '<img src="image/pv5-side.png" alt="">UD택시' +
                            '<span class="icon icon--sm icon--chevron-right" aria-hidden="true"></span>' +
                        '</a>' +
                        '<button type="button" class="history-item__del" data-del="' + r.id + '" aria-label="' + day(r.doneAt) + ' 이용내역 삭제">' +
                            '<span class="icon icon--close" aria-hidden="true"></span>' +
                        '</button>' +
                    '</div>' +
                    '<dl class="history-item__rows">' +
                        '<div><dt>날짜</dt><dd>' + shortDay(r.doneAt) + '</dd></div>' +
                        '<div><dt>운행 시간</dt><dd>' + times + '</dd></div>' +
                        '<div><dt>출발</dt><dd>' + esc(r.pickup) + '</dd></div>' +
                        '<div><dt>도착</dt><dd>' + esc(r.dest) + '</dd></div>' +
                        '<div><dt>금액</dt><dd><span class="history-item__fare">' + r.fare.toLocaleString('ko-KR') + '원</span> <span class="history-item__fare-note">예상 · 현장 결제</span></dd></div>' +
                    '</dl>' +
                    '<div class="history-item__actions">' +
                        '<button type="button" class="history-item__btn" data-action="call-driver">기사님께 전화</button>' +
                        rate +
                    '</div>' +
                '</li>';
            }).join('');
        }

        // X: 삭제 확인 → 지우고 목록 다시 그림
        list.addEventListener('click', function (e) {
            var del = e.target.closest('[data-del]');
            if (!del) return;
            var id = Number(del.dataset.del);
            Actions.openLayer('dialog',
                '<div class="confirm-dialog__head confirm-dialog__head--left">' +
                    '<h2 class="confirm-dialog__title confirm-dialog__title--sm">이용내역을 삭제할까요?</h2>' +
                    '<p class="confirm-dialog__desc">삭제하면 이 이동의 기록과 평가를 다시 볼 수 없어요.</p>' +
                '</div>' +
                '<div class="confirm-dialog__actions">' +
                    '<button type="button" class="btn btn--outline btn--md" data-keep>취소</button>' +
                    '<button type="button" class="btn btn--outline btn--md btn--danger-text" data-remove>삭제</button>' +
                '</div>',
                function (box, close) {
                    box.querySelector('[data-keep]').addEventListener('click', function () { close(); });
                    box.querySelector('[data-remove]').addEventListener('click', function () {
                        close(true);
                        Trip.removeHistory(id);
                        renderList();
                        Toast.show('이용내역을 삭제했어요', { check: true });
                        var next = list.querySelector('.history-item__title') || document.querySelector('.tab-page-head__title');
                        if (next) { next.setAttribute('tabindex', '-1'); next.focus(); }
                    });
                }, del);
        });

        renderLive();
        renderList();
        // 이용 상세에서 평가하고 뒤로 왔을 때 카드에 반영
        window.addEventListener('pageshow', function (e) { if (e.persisted) renderList(); });
        setInterval(function () {
            var before = liveStage;
            renderLive();
            // 이동이 끝나면 방금 이동이 목록에 들어오게 새로 열기
            if (before && !liveStage) location.reload();
        }, 2000);
    </script>
</body>
</html>
