<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용내역 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610221309">
    <link rel="stylesheet" href="css/tabs.css?v=2610221309">
    <script src="js/common.js?v=2610221309"></script>
    <script src="js/config.js?v=2610221309"></script>
    <script src="js/trip.js?v=2610221309"></script>
    <script src="js/push.js?v=2610221309"></script>
    <script src="js/stats.js?v=2610221309"></script>
</head>
<body>
    <!-- 이용내역 (이동 완료 화면에서 남긴 기록 · 누르면 자세히) -->
    <div id="wrap">
        <header class="tab-page-head">
            <h1 class="tab-page-head__title">이용내역</h1>
        </header>

        <main class="content tab-page">
            <!-- 지금 진행 중인 호출 (있을 때만 · 찾는 중 / 오는 중 / 도착 / 탑승 중) -->
            <section class="live-call" data-live-call hidden aria-live="polite">
                <p class="live-call__label">지금 진행 중</p>
                <a class="live-call__card" href="waiting.html" data-live-link>
                    <span class="live-call__top">
                        <span class="live-call__badge" data-live-badge>찾는 중</span>
                        <span class="live-call__time" data-live-time></span>
                    </span>
                    <span class="live-call__title" data-live-title>차량을 찾고 있어요</span>
                    <span class="live-call__desc" data-live-desc></span>
                    <span class="live-call__route" data-live-route></span>
                    <ol class="live-steps" aria-label="진행 단계" data-live-steps>
                        <li>접수</li><li>배정</li><li>도착</li><li>탑승</li><li>완료</li>
                    </ol>
                    <span class="live-call__go">진행 화면 보기 <span class="icon icon--xs icon--chevron-right" aria-hidden="true"></span></span>
                </a>
            </section>

            <ul class="history-list" data-history></ul>

            <div class="empty-card" data-history-empty hidden>
                <p class="empty-card__title">아직 이용 내역이 없어요</p>
                <p class="empty-card__desc">이동을 마치면 여기에서 다시 볼 수 있어요.</p>
                <a href="search.html" class="btn btn--primary">바로 부르기</a>
            </div>
        </main>

        <nav class="tab-bar" aria-label="주 메뉴">
            <a href="index.html" class="tab-bar__item">
                <span class="icon icon--home" aria-hidden="true"></span>
                홈
            </a>
            <a href="reserve.html" class="tab-bar__item">
                <span class="icon icon--calendar" aria-hidden="true"></span>
                예약
            </a>
            <a href="history.html" class="tab-bar__item is-active" aria-current="page">
                <span class="icon icon--time" aria-hidden="true"></span>
                이용내역
            </a>
            <a href="#" class="tab-bar__item" data-soon="설정 화면">
                <span class="icon icon--settings" aria-hidden="true"></span>
                설정
            </a>
        </nav>
    </div>

    <script>
        var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
        var driver = (window.APP_CONFIG && APP_CONFIG.driver) || {};

        function esc(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function day(time) {
            var d = new Date(time);
            return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
        }
        function hm(time) {
            var d = new Date(time);
            return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        }

        // 지금 진행 중인 호출 (js/push.js Progress · 2초마다 다시 확인)
        var LIVE = {
            waiting: { badge: '찾는 중', tone: 'wait', title: '차량을 찾고 있어요', step: 0 },
            assigned: { badge: '오는 중', title: 'UD택시가 오고 있어요', desc: '약 8분 후 도착 예정', step: 1 },
            arriving: { badge: '곧 도착', title: 'UD택시가 거의 다 왔어요', desc: '약 3분 후 도착 예정', step: 1 },
            arrived: { badge: '도착', title: '차량이 도착했어요', desc: '탑승 위치에 차가 섰어요', step: 2 },
            riding: { badge: '탑승 중', tone: 'ride', title: '목적지로 이동 중이에요', step: 3 }
        };
        var liveBox = document.querySelector('[data-live-call]');
        var liveStage = null;
        function renderLive() {
            var step = window.Progress && Progress.sync();
            var key = step && LIVE[step.stage] ? step.stage : null;
            if (key === liveStage) return;
            liveStage = key;
            liveBox.hidden = !key;
            if (!key) return;
            var s = LIVE[key];
            var t = Trip.get();
            var badge = liveBox.querySelector('[data-live-badge]');
            badge.textContent = s.badge;
            badge.className = 'live-call__badge' + (s.tone ? ' live-call__badge--' + s.tone : '');
            liveBox.querySelector('[data-live-time]').textContent = hm(t.calledAt) + ' 접수';
            liveBox.querySelector('[data-live-title]').textContent = s.title;
            var dest = (t.destination && t.destination.name) || '은평성모병원';
            var desc = key === 'waiting'
                ? (window.WaitStats ? '차량 배정까지 예상 약 ' + WaitStats.forDay().avg + '분' : '')
                : key === 'riding' ? dest + '까지 가고 있어요' : s.desc + ' · ' + ((driver.plate || '') + ' ' + (driver.car || '')).trim();
            liveBox.querySelector('[data-live-desc]').textContent = desc;
            liveBox.querySelector('[data-live-route]').textContent = (t.pickupName || '래미안베라힐즈 정문') + ' → ' + dest;
            liveBox.querySelector('[data-live-link]').href = step.url;
            liveBox.querySelectorAll('[data-live-steps] li').forEach(function (li, i) {
                li.className = i < s.step ? 'is-done' : i === s.step ? 'is-now' : '';
                if (i === s.step) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
            });
        }

        var items = Trip.history();
        var list = document.querySelector('[data-history]');
        document.querySelector('[data-history-empty]').hidden = items.length > 0;

        list.innerHTML = items.map(function (r, i) {
            var times = r.boardedAt ? hm(r.boardedAt) + ' 탑승 · ' + hm(r.doneAt) + ' 하차' : hm(r.doneAt) + ' 이동 완료';
            var help = r.helpRequests && r.helpRequests.length
                ? '<ul class="history-item__requests">' + r.helpRequests.map(function (q) {
                    return '<li>' + hm(q.at) + ' · ' + esc(q.title) + (q.text ? ' · "' + esc(q.text) + '"' : '') + '</li>';
                }).join('') + '</ul>'
                : '<p class="history-item__none">보낸 도움 요청이 없어요</p>';
            return '<li class="history-item">' +
                '<button type="button" class="history-item__head" aria-expanded="false" aria-controls="history-' + i + '">' +
                    '<span class="history-item__date">' + day(r.doneAt) + ' · 이동 완료</span>' +
                    '<span class="history-item__route">' + esc(r.pickup) + ' <span aria-hidden="true">→</span><span class="blind">에서</span> ' + esc(r.dest) + '</span>' +
                    '<span class="history-item__meta">' + times + ' · ' + r.km + 'km</span>' +
                    '<span class="history-item__fare">' + r.fare.toLocaleString('ko-KR') + '원 <span class="history-item__fare-note">예상 · 바우처</span></span>' +
                    '<span class="icon icon--sm icon--chevron-down history-item__arrow" aria-hidden="true"></span>' +
                '</button>' +
                '<div class="history-item__body" id="history-' + i + '" hidden>' +
                    '<dl class="history-item__rows">' +
                        '<div><dt>차량</dt><dd>' + esc([driver.plate, driver.car, driver.name].filter(Boolean).join(' · ')) + '</dd></div>' +
                        '<div><dt>탑승 인원</dt><dd>' + esc(r.riders) + '</dd></div>' +
                        '<div><dt>기사님께 보낸 말</dt><dd>' + (r.chatCount ? r.chatCount + '건' : '없음') + '</dd></div>' +
                    '</dl>' +
                    '<p class="history-item__label">도움 요청 내역</p>' + help +
                    '<a href="feedback.html" class="btn btn--outline btn--md">탑승 경험 남기기</a>' +
                '</div>' +
            '</li>';
        }).join('');

        // 누르면 자세히 펼침 / 접힘
        list.addEventListener('click', function (e) {
            var head = e.target.closest('.history-item__head');
            if (!head) return;
            var open = head.getAttribute('aria-expanded') !== 'true';
            head.setAttribute('aria-expanded', open);
            document.getElementById(head.getAttribute('aria-controls')).hidden = !open;
        });

        renderLive();
        // 진행 중인 호출이 있으면 "아직 이용 내역이 없어요" 대신 진행 카드만
        if (liveStage) document.querySelector('[data-history-empty]').hidden = true;
        setInterval(function () {
            var before = liveStage;
            renderLive();
            // 이동이 끝나면 방금 이동이 목록에 들어오게 새로 열기
            if (before && !liveStage) location.reload();
        }, 2000);
    </script>
</body>
</html>
