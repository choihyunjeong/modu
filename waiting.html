<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 밝은·어두운 화면 둘 다 지원 (다크모드·절전모드면 앱의 어두운 색으로 · 브라우저가 색을 억지로 뒤집지 않음) -->
    <meta name="color-scheme" content="light dark">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>차량 찾는 중 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610241256">
    <link rel="stylesheet" href="css/progress.css?v=2610241256">
    <script src="js/common.js?v=2610241256"></script>
    <script src="js/config.js?v=2610241256"></script>
    <script src="js/trip.js?v=2610241256"></script>
    <script src="js/map.js?v=2610241256"></script>
    <script src="js/push.js?v=2610241256"></script>
    <script src="js/actions.js?v=2610241256"></script>
    <script src="js/stats.js?v=2610241256"></script>
    <script src="js/ride-info.js?v=2610241256"></script>
</head>
<body>
    <div id="wrap" class="map-page" data-sheet-fit data-progress-stage="waiting" data-cancel-stage="before">
        <div class="map-view" style="--map-height: 244px; --map-img-top: -235px;" data-map data-center="pickup">
            <img class="map-view__static" src="image/map-static.png" alt="">

            <div class="map-me" data-static-pos data-place="me" style="--x: 108px; --y: 192px; --heading: 139deg;">
                <img src="image/map-heading.svg" alt="">
            </div>
            <div class="map-pulse" data-static-pos data-place="pickup" style="--x: 126px; --y: 136px;" aria-hidden="true">
                <img src="image/map-pulse-1.svg" alt="">
                <img src="image/map-pulse-2.svg" alt="">
                <img src="image/map-pulse-3.svg" alt="">
            </div>
            <div class="map-pin map-pin--wait" data-static-pos data-place="pickup" style="--x: 34px; --y: 88px;">
                <span class="map-pin__label">
                    <span class="icon icon--xs icon--user" aria-hidden="true"></span>
                    여기서 탑승 · <span data-trip="pickup-short">정문</span>
                </span>
                <span class="map-pin__dot"></span>
            </div>

            <a href="index.html" class="btn-float btn-float--back btn-float--line" aria-label="홈으로">
                <span class="icon icon--arrow-left" aria-hidden="true"></span>
            </a>
            <button type="button" class="btn-float btn-float--locate" aria-label="내 위치로 이동" data-locate>
                <span class="icon icon--location-current" aria-hidden="true"></span>
            </button>
            <button type="button" class="btn-pill-float" data-action="cancel" aria-haspopup="dialog">호출 취소</button>
        </div>

        <section class="sheet sheet--progress">
            <span class="sheet__grabber" aria-hidden="true"></span>

            <!-- 상태 · 예상 -->
            <div class="progress-group">
                <div class="status-head">
                    <span class="status-head__icon"><span class="icon-placeholder" aria-hidden="true"></span></span>
                    <div class="status-head__text">
                        <h1 class="status-head__title">차량을 찾고 있어요</h1>
                        <p class="status-head__desc" data-trip="called-status">접수 후 3분 경과 · 접수번호 1125</p>
                    </div>
                </div>

                <div class="wait-card">
                    <div class="wait-card__head">
                        <p class="wait-card__label">승차까지 예상</p>
                    </div>
                    <p class="wait-card__minutes">약 <span data-stat="nowWait">27</span>분</p>
                </div>
            </div>

            <!-- 경로 · 전달 정보 -->
            <div class="progress-group progress-group--route">
                <ul class="route-list">
                    <li class="route-list__item">
                        <img src="image/route-dot-start.svg" alt="">
                        <span class="route-list__label">출발</span>
                        <span class="route-list__place" data-trip="pickup-name">래미안베라힐즈 정문</span>
                    </li>
                    <li class="route-list__item">
                        <img src="image/route-dot-end.svg" alt="">
                        <span class="route-list__label">도착</span>
                        <span class="route-list__place" data-trip="dest-name">은평성모병원</span>
                    </li>
                    <li class="route-list__line" role="presentation"><img src="image/route-line.svg" alt=""></li>
                </ul>

                <ul class="tag-list" aria-label="함께 전달된 정보" data-ride-tags>
                    <li class="tag" data-trip="riders">본인 + 동승자 1명</li>
                    <li class="tag tag--warning">탑승 정보 미등록</li>
                </ul>
            </div>

            <!-- 안내 · 버튼 -->
            <div class="progress-group">
                <p class="notice-line">
                    <span class="icon icon--xs icon--notification" aria-hidden="true"></span>
                    앱을 닫아도 차가 정해지면 알려드려요
                </p>

                <div class="btn-row">
                    <button type="button" class="btn btn--outline" data-action="share" aria-haspopup="dialog">보호자에게 알리기</button>
                    <button type="button" class="btn btn--outline" data-action="call-center">콜센터 문의</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 함께 전달된 정보: 접수할 때 담은 탑승 정보 (없으면 지금 저장된 탑승 정보 · 그것도 없으면 디자인 예시 그대로)
        (function () {
            var tags = Trip.get().ride || RideInfo.tags();
            if (!tags) return;   // 등록 안 했으면 "탑승 정보 미등록" 그대로
            var box = document.querySelector('[data-ride-tags]');
            var riders = box.querySelector('[data-trip="riders"]');
            box.innerHTML = '';
            box.appendChild(riders);
            tags.forEach(function (tag) {
                var li = document.createElement('li');
                li.className = 'tag' + (tag.tone ? ' tag--' + tag.tone : '');
                li.textContent = tag.text;
                box.appendChild(li);
            });
        })();
    </script>
</body>
</html>
