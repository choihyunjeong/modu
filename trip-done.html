<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>이동 완료 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610221940">
    <link rel="stylesheet" href="css/after.css?v=2610221940">
    <script src="js/common.js?v=2610221940"></script>
    <script src="js/config.js?v=2610221940"></script>
    <script src="js/trip.js?v=2610221940"></script>
</head>
<body>
    <div id="wrap">
        <header class="app-header">
            <a href="index.html" class="app-header__back" aria-label="홈으로">
                <span class="icon icon--chevron-left" aria-hidden="true"></span>
            </a>
            <h1 class="app-header__title app-header__title--medium">이동 완료</h1>
            <span class="app-header__blank" aria-hidden="true"></span>
        </header>

        <main class="content content--done">
            <div class="done-title">
                <h2 class="page-title__heading">
                    <span data-trip="done-dest">은평성모병원에</span>
                    <span>도착했어요</span>
                </h2>
                <p class="done-title__desc" data-trip="done-desc">16:08 하차 · 오늘 이동이 끝났어요</p>
            </div>

            <div class="card trip-summary">
                <p class="trip-summary__route" data-trip="done-route">래미안베라힐즈 정문 &nbsp;→&nbsp; 은평성모병원</p>
                <p class="trip-summary__meta" data-trip="done-meta">15:55 탑승 · 16:08 하차 · 4.9km</p>
                <p class="trip-summary__meta">33바 5521 · 흰색 PV5 · 강○○ 기사님 · <span data-trip="riders">본인 + 동승자 1명</span></p>
            </div>

            <!-- 귀가 알림을 설정한 경우에만 (기본은 숨김) -->
            <div class="return-banner" hidden>
                <div>
                    <p class="return-banner__title">돌아갈 때 호출 알림 · 오후 2:30</p>
                    <p class="return-banner__desc">알림이 오면 바로 호출할 수 있어요</p>
                </div>
                <button type="button" class="return-banner__edit" data-soon="귀가 알림 바꾸기">바꾸기 ›</button>
            </div>

            <div class="done-actions">
                <!-- 이용 상세(운행·결제 정보)로 가서 바로 별점 창이 열림 · 평가했으면 상세 보기 -->
                <a href="feedback.html#rate" class="feedback-entry" data-feedback-entry>
                    <span>
                        <span class="feedback-entry__title" data-feedback-title>이번 탑승은 어떠셨나요?</span>
                        <span class="feedback-entry__desc" data-feedback-desc>별점으로 탑승 경험 남기기</span>
                    </span>
                    <span class="icon icon--sm icon--chevron-right feedback-entry__arrow" aria-hidden="true"></span>
                </a>

                <a href="index.html" class="btn btn--primary btn--home">홈으로</a>
                <a href="history.html" class="btn btn--text">이용내역에서 보기</a>
            </div>
        </main>
    </div>

    <script>
        // 이번 이동을 이용내역에 남김 (같은 호출은 한 번만)
        Trip.recordDone();

        // 방금 이동 기록으로 연결 · 이미 평가했으면 "○점으로 평가했어요 · 이용 상세 보기"
        (function () {
            var rec = Trip.history()[0];
            if (!rec) return;
            var entry = document.querySelector('[data-feedback-entry]');
            entry.href = 'feedback.html?id=' + rec.id + (rec.rating ? '' : '#rate');
            if (rec.rating) {
                document.querySelector('[data-feedback-title]').textContent = '★ ' + rec.rating + '점으로 평가했어요';
                document.querySelector('[data-feedback-desc]').textContent = '이용 상세 보기';
            }
        })();
        // 이용 상세에서 뒤로 왔을 때도 평가 결과가 보이게
        window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
    </script>
</body>
</html>
