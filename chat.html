<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 밝은·어두운 화면 둘 다 지원 (다크모드·절전모드면 앱의 어두운 색으로 · 브라우저가 색을 억지로 뒤집지 않음) -->
    <meta name="color-scheme" content="light dark">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>기사님과 대화 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610241137">
    <link rel="stylesheet" href="css/progress.css?v=2610241137">
    <script src="js/common.js?v=2610241137"></script>
    <script src="js/config.js?v=2610241137"></script>
    <script src="js/trip.js?v=2610241137"></script>
    <script src="js/actions.js?v=2610241137"></script>
    <script src="js/push.js?v=2610241137"></script>
</head>
<body>
    <!-- F4 기사 대화 · 탑승 전 (?stage=before · soon · arrived) / F5 이동 중 (?stage=riding) -->
    <div id="wrap" class="chat-page" data-stage="before">
        <header class="chat-head">
            <a href="assigned.html" class="chat-head__back" data-history-back data-chat-back aria-label="뒤로">
                <span class="icon icon--arrow-left" aria-hidden="true"></span>
            </a>
            <div class="chat-head__who">
                <h1 class="chat-head__name" data-chat-name>강민준 기사님</h1>
                <p class="chat-head__sub" data-chat-sub>33바 5521 · 약 8분 후 도착 예정</p>
            </div>
            <button type="button" class="chat-round" data-action="call-driver" aria-label="기사님께 전화">
                <span class="icon icon--phone" aria-hidden="true"></span>
            </button>
        </header>

        <p class="chat-notice">
            <span class="icon icon--sm icon--information" aria-hidden="true"></span>
            보낸 말은 기사님 차 화면에 글로 뜨고 한 번 읽어 드려요. 운전 중이라 답은 늦을 수 있어요.
        </p>

        <main class="chat-log" data-chat-log aria-live="polite" aria-label="대화 내용"></main>

        <section class="chat-quick" aria-labelledby="chat-quick-title">
            <h2 class="chat-quick__title" id="chat-quick-title">자주 쓰는 말 바로 보내기</h2>
            <p class="chat-quick__desc">누르면 기사님께 바로 전송돼요.</p>
            <div class="chat-quick__chips" data-chat-quick></div>
        </section>

        <form class="chat-input" data-chat-form>
            <button type="button" class="chat-round chat-round--help" data-action="help" aria-haspopup="dialog" aria-label="도움 요청">
                <span class="icon icon--hand" aria-hidden="true"></span>
            </button>
            <div class="chat-input__box">
                <input class="chat-input__field" id="chat-text" type="text" maxlength="40" placeholder="메시지 입력 · 40자까지" aria-label="기사님께 보낼 메시지" autocomplete="off" enterkeyhint="send">
                <button type="button" class="chat-input__mic" data-voice-for="chat-text" aria-label="말로 입력하기">
                    <span class="icon icon--microphone" aria-hidden="true"></span>
                </button>
            </div>
            <button type="submit" class="chat-round chat-round--send" aria-label="보내기">
                <span class="icon icon--send" aria-hidden="true"></span>
            </button>
        </form>
    </div>

    <script src="js/chat.js?v=2610241137"></script>
</body>
</html>
