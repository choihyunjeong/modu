<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 밝은·어두운 화면 둘 다 지원 (다크모드·절전모드면 앱의 어두운 색으로 · 브라우저가 색을 억지로 뒤집지 않음) -->
    <meta name="color-scheme" content="light dark">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>보호자 연결 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610241250">
    <link rel="stylesheet" href="css/guardian.css?v=2610241250">
    <script src="js/common.js?v=2610241250"></script>
    <script src="js/config.js?v=2610241250"></script>
</head>
<body>
    <div id="wrap">
        <header class="app-header">
            <a href="index.html" class="app-header__back" data-history-back aria-label="뒤로">
                <span class="icon icon--chevron-left" aria-hidden="true"></span>
            </a>
            <h1 class="app-header__title">보호자 연결</h1>
            <span class="app-header__blank" aria-hidden="true"></span>
        </header>

        <main class="content content--sub guardian">
            <div class="page-title">
                <h2 class="page-title__heading">
                    <span>보호자로 연결할 분을</span>
                    <span>알려주세요</span>
                </h2>
                <p class="page-title__desc">상대방이 초대를 수락하면 연결돼요.</p>
            </div>

            <!-- 휴대폰 번호 -->
            <div class="text-field">
                <label for="guardian-phone" class="text-field__label">휴대폰 번호</label>
                <input type="tel" id="guardian-phone" class="text-field__input" placeholder="010-0000-0000" inputmode="numeric" autocomplete="tel" aria-describedby="guardian-phone-error">
                <p class="field-error" id="guardian-phone-error" role="alert" hidden>휴대폰 번호를 확인해 주세요.</p>
            </div>

            <!-- 관계 -->
            <div class="guardian__group guardian__group--tight">
                <p class="field-title">
                    <span class="field-title__main">연결할 분과의 관계</span>
                    <span class="field-title__sub">선택 사항</span>
                </p>
                <div class="guardian__chips" role="group" aria-label="연결할 분과의 관계" data-select-group>
                    <button type="button" class="chip chip--md" aria-pressed="true">가족</button>
                    <button type="button" class="chip chip--md" aria-pressed="false">활동지원사</button>
                    <button type="button" class="chip chip--md" aria-pressed="false">기타</button>
                </div>
            </div>

            <!-- 허용할 기능 -->
            <div class="guardian__group">
                <p class="field-title">
                    <span class="field-title__main">연결할 분이 이용할 기능</span>
                    <span class="field-title__sub">허용할 기능을 선택해 주세요</span>
                </p>
                <div class="card choice-list">
                    <label class="choice-list__item">
                        <input type="checkbox" class="checkbox" name="permission" value="notify">
                        <span class="choice-list__text">
                            <span class="choice-list__title">이동 알림 받기</span>
                            <span class="choice-list__desc">접수·배차·도착을 함께 받아요</span>
                        </span>
                    </label>
                    <label class="choice-list__item">
                        <input type="checkbox" class="checkbox" name="permission" value="proxy">
                        <span class="choice-list__text">
                            <span class="choice-list__title">대신 접수하기</span>
                            <span class="choice-list__desc">내 탑승 정보로 차를 부를 수 있어요</span>
                        </span>
                    </label>
                </div>
            </div>

            <p class="notice notice--sub">
                <span class="icon icon--sm icon--information" aria-hidden="true"></span>
                초대 문자를 보내면, 상대방이 수락한 뒤에 연결돼요. 함께 타는지는 이동을 접수할 때마다 물어봐요.
            </p>
        </main>

        <div class="bottom-action">
            <button type="button" class="btn btn--primary" data-send-invite>초대 문자 보내기</button>
            <a href="index.html" class="btn btn--text">나중에 할게요</a>
        </div>
    </div>

    <script>
        // 초대 문자 보내기: 번호·관계·허용 기능을 저장 (수락 전까지는 '수락 대기' · 알림이 가지 않음)
        var phone = document.getElementById('guardian-phone');
        var phoneError = document.getElementById('guardian-phone-error');
        // 휴대폰 번호를 끝까지 넣어야 보내기 버튼이 켜짐 · 다 넣었는데 형식이 틀리면 칸 아래 안내
        var inviteBtn = document.querySelector('[data-send-invite]');
        function syncInvite() {
            var digits = phone.value.replace(/\D/g, '');
            inviteBtn.disabled = !/^01\d{8,9}$/.test(digits);
            phoneError.hidden = digits.length < 10 || !inviteBtn.disabled;
        }
        phone.addEventListener('input', syncInvite);
        syncInvite();
        inviteBtn.addEventListener('click', function () {
            var digits = phone.value.replace(/\D/g, '');
            if (!/^01\d{8,9}$/.test(digits)) {
                phoneError.hidden = false;
                phone.focus();
                return;
            }
            var shown = digits.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
            var relation = document.querySelector('.guardian__chips [aria-pressed="true"]');
            Guardians.invite({
                relation: relation ? relation.textContent.trim() : '',
                phone: shown,
                notify: document.querySelector('input[name="permission"][value="notify"]').checked,
                proxy: document.querySelector('input[name="permission"][value="proxy"]').checked
            });
            StateNotice.leave('초대 문자를 보냈어요 · 상대방이 수락하면 연결돼요');
            location.href = 'index.html';
        });
    </script>
</body>
</html>
