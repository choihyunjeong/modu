<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>탑승 위치 확인 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610221348">
    <link rel="stylesheet" href="css/call.css?v=2610221348">
    <script src="js/common.js?v=2610221348"></script>
    <script src="js/config.js?v=2610221348"></script>
    <script src="js/trip.js?v=2610221348"></script>
    <script src="js/map.js?v=2610221348"></script>
</head>
<body>
    <div id="wrap" class="map-page map-page--pickup">
        <div class="map-view" style="--map-height: 305px; --map-img-top: -248px;" data-map data-center="pickup">
            <img class="map-view__static" src="image/map-static.png" alt="">

            <div class="map-me" data-static-pos data-place="me" style="--x: 112px; --y: 177px;">
                <img src="image/map-heading.svg" alt="">
            </div>
            <div class="map-pin" data-static-pos data-place="pickup" style="--x: 62px; --y: 220px;">
                <span class="map-pin__label">
                    <span class="icon icon--xs icon--user" aria-hidden="true"></span>
                    여기서 탑승
                </span>
                <span class="map-pin__stem"></span>
                <span class="map-pin__dot"></span>
            </div>

            <a href="search.html" class="btn-float btn-float--back" data-history-back aria-label="뒤로">
                <span class="icon icon--arrow-left" aria-hidden="true"></span>
            </a>
            <button type="button" class="btn-float btn-float--locate" aria-label="내 위치로 이동" data-locate>
                <span class="icon icon--location-current" aria-hidden="true"></span>
            </button>
        </div>

        <section class="sheet">
            <span class="sheet__grabber" aria-hidden="true"></span>
            <div class="sheet-head">
                <h1 class="sheet-title">탑승 위치를 확인해 주세요</h1>
                <p class="sheet-desc">추천 위치를 고르거나 다른 위치를 선택하세요</p>
            </div>

            <fieldset class="pickup-options">
                <legend class="blind">탑승 위치</legend>
                <label class="pickup-option">
                    <input type="radio" class="radio" name="pickup" value="apt-main" data-name="래미안베라힐즈 정문" data-short="정문" data-spot="정문 · 경사로 쪽" data-lat="37.60277" data-lng="126.93638" data-x="62" data-y="220" checked>
                    <span class="pickup-option__text">
                        <span class="pickup-option__title">
                            정문
                            <span class="badge badge--primary">추천</span>
                        </span>
                        <span class="pickup-option__desc">경사로 있어요 · 차가 설 자리 있어요 · 슬로프 펼칠 공간 있음 · 집에서 약 50m</span>
                    </span>
                </label>
                <label class="pickup-option">
                    <input type="radio" class="radio" name="pickup" value="back-parking" data-name="래미안베라힐즈 2번 게이트" data-short="2번 게이트" data-spot="2번 게이트" data-lat="37.60532" data-lng="126.93618" data-x="168" data-y="132">
                    <span class="pickup-option__text">
                        <span class="pickup-option__title">2번 게이트</span>
                        <span class="pickup-option__desc">턱 없어요 · 차가 설 자리 좁아요 · 슬로프 공간 확인 안 됨 · 집에서 약 300m</span>
                    </span>
                </label>
            </fieldset>

            <div class="sheet-actions">
                <button type="button" class="btn btn--gray btn--md" data-soon="다른 위치 선택">다른 위치 선택하기</button>
                <a href="confirm.html" class="btn btn--primary" data-confirm-pickup>이 위치로 부를게요</a>
            </div>
        </section>
    </div>
    <script>
        // 탑승 위치를 고르면 지도 핀이 그 자리로 옮겨가고, 이번 호출에 저장
        var pin = document.querySelector('.map-pin[data-place="pickup"]');
        function choosePickup(radio) {
            var d = radio.dataset;
            var pos = { lat: Number(d.lat), lng: Number(d.lng) };
            Trip.set({ pickupName: d.name, pickupShort: d.short, pickupSpot: d.spot, pickupPos: pos });
            MapKit.setPlace('pickup', pos);
            // 정적 지도일 때는 디자인 좌표로 옮김
            pin.style.setProperty('--x', d.x + 'px');
            pin.style.setProperty('--y', d.y + 'px');
        }
        document.querySelectorAll('input[name="pickup"]').forEach(function (radio) {
            radio.addEventListener('change', function () { choosePickup(radio); });
        });
        // 이전에 고른 탑승 위치가 있으면 그대로 선택해 둠
        var saved = Trip.get().pickupShort;
        var current = saved && document.querySelector('input[name="pickup"][data-short="' + saved + '"]');
        if (current) current.checked = true;
        choosePickup(document.querySelector('input[name="pickup"]:checked'));
    </script>
</body>
</html>
