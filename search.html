<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>목적지 검색 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610221631">
    <link rel="stylesheet" href="css/search.css?v=2610221631">
    <script src="js/common.js?v=2610221631"></script>
    <script src="js/config.js?v=2610221631"></script>
    <script src="js/trip.js?v=2610221631"></script>
    <script src="js/map.js?v=2610221631"></script>
    <script src="js/places.js?v=2610221631"></script>
    <script src="js/favorites.js?v=2610221631"></script>
</head>
<body>
    <div id="wrap">
        <!-- 검색 영역 -->
        <div class="search-area">
            <div class="search-area__row">
                <a href="index.html" class="search-area__back" data-history-back aria-label="뒤로">
                    <span class="icon icon--chevron-left" aria-hidden="true"></span>
                </a>
                <form class="search-box" role="search" onsubmit="return false;">
                    <span class="icon icon--search" aria-hidden="true"></span>
                    <label for="destination" class="blind">목적지</label>
                    <input type="search" id="destination" class="search-box__input" placeholder="어디로 가세요?" autocomplete="off" enterkeyhint="search">
                    <button type="button" class="search-box__voice" aria-label="말로 목적지 입력" data-voice-for="destination">
                        <span class="icon icon--microphone" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
            <div class="search-area__quick">
                <a href="map-pick.html?mode=dest" class="map-chip">
                    <span class="icon icon--xs icon--map" aria-hidden="true"></span>
                    지도에서 직접 고르기
                </a>
            </div>
            <p class="search-area__help">장소를 고르면 내릴 출입구(정문·후문)도 확인해요</p>
        </div>

        <hr class="divider">

        <!-- 검색 결과 (입력하면 자주 가는 곳·최근 목적지 대신 보임) -->
        <section class="place-block" data-search-results hidden>
            <h2 class="blind">검색 결과</h2>
            <ul class="place-list place-list--recent" data-result-list aria-live="polite"></ul>
            <p class="search-empty" data-result-loading hidden>찾고 있어요…</p>
            <p class="search-empty" data-result-empty hidden>검색 결과가 없어요. 다른 이름으로 찾아보세요.</p>
        </section>

        <div data-search-default>
        <!-- 자주 가는 곳 -->
        <section class="place-block">
            <div class="place-block__head">
                <h2 class="place-block__title">자주 가는 곳</h2>
                <a href="favorites.html" class="place-block__action">편집</a>
            </div>
            <!-- 집 + 추가한 곳 (js/favorites.js) -->
            <ul class="place-list" data-fav-list></ul>
        </section>

        <hr class="divider divider--thick">

        <!-- 최근 목적지 -->
        <section class="place-block">
            <div class="place-block__head">
                <h2 class="place-block__title">최근 목적지</h2>
                <button type="button" class="place-block__action" data-clear-recent>전체 지우기</button>
            </div>
            <!-- 이동을 마친 곳 (처음엔 비어 있음 · 이동 완료되면 생김) -->
            <p class="search-empty" data-recent-empty hidden>아직 최근 목적지가 없어요. 이동을 마치면 여기에 보여요.</p>
            <ul class="place-list place-list--recent" data-recent-list></ul>
        </section>
        </div>
    </div>

    <script>
        // 목적지 고르기: 이번 호출의 목적지로 저장하고 호출 전 확인(E3b)으로
        //  출발지와 같은 곳(집에서 집)이어도 막지 않고 그대로 진행 (일반 택시 앱처럼 · 거리 0m)
        function chooseDest(name, addr, lat, lng) {
            var chosen = { name: name, addr: addr, lat: Number(lat), lng: Number(lng) };
            Trip.start(chosen);
            location.href = 'confirm.html';
        }

        function esc(text) {
            var div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // 자주 가는 곳: 집 + 추가한 곳
        document.querySelector('[data-fav-list]').innerHTML = Favorites.list().map(function (f, i) {
            return '<li><a href="confirm.html" class="place-list__item" data-pick="fav" data-i="' + i + '">' +
                '<span class="place-list__tile"><span class="icon ' + (f.type === 'home' ? 'icon--home' : 'icon--location-star') + '" aria-hidden="true"></span></span>' +
                '<span class="place-list__text"><strong class="place-list__name">' + esc(f.name) + '</strong>' +
                '<span class="place-list__addr">' + esc(f.addr) + '</span></span></a></li>';
        }).join('');

        // 최근 목적지: 이동을 마친 곳만 (처음엔 비어 있음)
        var recentItems = Recent.list().filter(function (r) { return r.lat && r.lng; });
        var recentList = document.querySelector('[data-recent-list]');
        var recentEmpty = document.querySelector('[data-recent-empty]');
        var clearBtn = document.querySelector('[data-clear-recent]');
        function renderRecent() {
            recentList.innerHTML = recentItems.map(function (r, i) {
                return '<li class="place-list__item"><a href="confirm.html" class="place-list__text" data-pick="recent" data-i="' + i + '">' +
                    '<span class="place-list__name">' + esc(r.name) + '</span>' +
                    (r.addr ? '<span class="place-list__addr">' + esc(r.addr) + '</span>' : '') + '</a></li>';
            }).join('');
            recentEmpty.hidden = recentItems.length > 0;
            clearBtn.hidden = !recentItems.length;
        }
        renderRecent();
        clearBtn.addEventListener('click', function () {
            Recent.clear();
            recentItems = [];
            renderRecent();
            Toast.show('최근 목적지를 지웠어요', { check: true });
        });

        document.addEventListener('click', function (e) {
            var a = e.target.closest('[data-pick]');
            if (!a) return;
            e.preventDefault();
            var p = (a.dataset.pick === 'fav' ? Favorites.list() : recentItems)[Number(a.dataset.i)];
            chooseDest(p.name, p.addr, p.lat, p.lng);
        });

        // 장소 검색 (카카오 장소 검색 · 내 위치 가까운 곳 먼저)
        var input = document.getElementById('destination');
        var results = document.querySelector('[data-search-results]');
        var list = document.querySelector('[data-result-list]');
        var empty = document.querySelector('[data-result-empty]');
        var defaults = document.querySelector('[data-search-default]');
        var timer = null;

        var loading = document.querySelector('[data-result-loading]');

        function render(items) {
            list.innerHTML = '';
            loading.hidden = true;
            if (items === null) {
                empty.textContent = '검색하지 못했어요. 인터넷 연결을 확인해 주세요.';
                items = [];
            }
            empty.hidden = items.length > 0;
            items.forEach(function (place) {
                var li = document.createElement('li');
                li.className = 'place-list__item';
                var a = document.createElement('a');
                a.href = 'pickup.html';
                a.className = 'place-list__text';
                var name = document.createElement('span');
                name.className = 'place-list__name';
                name.textContent = place.name;
                var addr = document.createElement('span');
                addr.className = 'place-list__addr';
                addr.textContent = place.addr;
                a.appendChild(name);
                a.appendChild(addr);
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    chooseDest(place.name, place.addr, place.lat, place.lng);
                });
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        // 장소 검색 (js/places.js · 카카오 → 못 쓰면 OpenStreetMap)
        //  가장 마지막에 요청한 검색의 결과만 보여 줌 (휴대폰 한글 조합 중 글자 차이로 결과를 버리지 않게)
        //  6초가 넘게 걸리면 안내
        var lastQuery = '';
        var slowTimer = null;
        function search(query) {
            lastQuery = query;
            clearTimeout(slowTimer);
            slowTimer = setTimeout(function () {
                if (lastQuery === query && !loading.hidden) loading.textContent = '검색이 오래 걸리고 있어요. 인터넷 연결을 확인해 주세요…';
            }, 6000);
            Places.search(query, function (items) {
                if (query !== lastQuery) return;
                clearTimeout(slowTimer);
                loading.textContent = '찾고 있어요…';
                render(items);
            });
        }

        function onType() {
            var query = input.value.trim();
            clearTimeout(timer);
            results.hidden = !query;
            defaults.hidden = !!query;
            if (!query) { lastQuery = ''; return; }
            if (query === lastQuery && list.children.length) return;
            list.innerHTML = '';
            empty.hidden = true;
            empty.textContent = '검색 결과가 없어요. 다른 이름으로 찾아보세요.';
            loading.hidden = false;
            timer = setTimeout(function () { search(query); }, 250);
        }
        input.addEventListener('input', onType);
        // 휴대폰 한글 키보드: 글자 조합이 끝났을 때도 다시 찾음
        input.addEventListener('compositionend', onType);
        // 키보드의 "검색" 버튼: 기다리지 않고 바로
        input.form.addEventListener('submit', function (e) {
            e.preventDefault();
            var query = input.value.trim();
            if (!query) return;
            clearTimeout(timer);
            input.blur();
            search(query);
        });

        // 검색 화면을 열자마자 카카오 장소 검색을 미리 불러 둠 (첫 검색이 느리지 않게)
        MapKit.load(function () {}, function () {});

        // 음성으로 부르기에서 "목적지를 글자로 고치기"로 들어오면 들은 말을 넣어 바로 찾음
        var preset = new URLSearchParams(location.search).get('q');
        if (preset) {
            input.value = preset;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.focus();
        }
    </script>
</body>
</html>
