<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목적지 검색 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/search.css">
    <script src="js/common.js"></script>
    <script src="js/config.js"></script>
    <script src="js/trip.js"></script>
    <script src="js/map.js"></script>
</head>
<body>
    <div id="wrap">
        <!-- 검색 영역 -->
        <div class="search-area">
            <div class="search-area__row">
                <a href="index.html" class="search-area__back" data-history-back aria-label="뒤로">
                    <span class="icon icon--chevron-left" aria-hidden="true"></span>
                </a>
                <form class="search-box" role="search" onsubmit="return false;">
                    <span class="icon icon--search" aria-hidden="true"></span>
                    <label for="destination" class="blind">목적지</label>
                    <input type="search" id="destination" class="search-box__input" placeholder="어디로 가세요?" autocomplete="off">
                    <button type="button" class="search-box__voice" aria-label="말로 목적지 입력">
                        <span class="icon icon--microphone" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
            <div class="search-area__quick">
                <button type="button" class="map-chip">
                    <span class="icon icon--xs icon--map" aria-hidden="true"></span>
                    지도에서 직접 고르기
                </button>
            </div>
            <p class="search-area__help">장소를 고르면 내릴 출입구(정문·후문)도 확인해요</p>
        </div>

        <hr class="divider">

        <!-- 검색 결과 (입력하면 자주 가는 곳·최근 목적지 대신 보임) -->
        <section class="place-block" data-search-results hidden>
            <h2 class="blind">검색 결과</h2>
            <ul class="place-list place-list--recent" data-result-list aria-live="polite"></ul>
            <p class="search-empty" data-result-empty hidden>검색 결과가 없어요. 다른 이름으로 찾아보세요.</p>
        </section>

        <div data-search-default>
        <!-- 자주 가는 곳 -->
        <section class="place-block">
            <div class="place-block__head">
                <h2 class="place-block__title">자주 가는 곳</h2>
                <button type="button" class="place-block__action">편집</button>
            </div>
            <ul class="place-list">
                <li>
                    <a href="pickup.html" class="place-list__item" data-dest="집" data-lat="37.60277" data-lng="126.93638">
                        <span class="place-list__tile"><span class="icon icon--home" aria-hidden="true"></span></span>
                        <span class="place-list__text">
                            <strong class="place-list__name">집</strong>
                            <span class="place-list__addr">은평구 통일로 630 · 래미안베라힐즈</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a href="pickup.html" class="place-list__item" data-dest="은평성모병원" data-lat="37.63361" data-lng="126.91630">
                        <span class="place-list__tile"><span class="icon icon--location-star" aria-hidden="true"></span></span>
                        <span class="place-list__text">
                            <strong class="place-list__name">은평성모병원</strong>
                            <span class="place-list__addr">은평구 통일로 1021 · 본관 정문</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a href="pickup.html" class="place-list__item" data-dest="녹번동 주민센터" data-lat="37.60222" data-lng="126.92992">
                        <span class="place-list__tile"><span class="icon icon--recently-viewed" aria-hidden="true"></span></span>
                        <span class="place-list__text">
                            <strong class="place-list__name">녹번동 주민센터</strong>
                            <span class="place-list__addr">은평구 은평로 195 · 은평구청 안</span>
                        </span>
                    </a>
                </li>
            </ul>
        </section>

        <hr class="divider divider--thick">

        <!-- 최근 목적지 -->
        <section class="place-block">
            <div class="place-block__head">
                <h2 class="place-block__title">최근 목적지</h2>
                <button type="button" class="place-block__action">전체 지우기</button>
            </div>
            <ul class="place-list place-list--recent">
                <li class="place-list__item">
                    <a href="pickup.html" class="place-list__text" data-dest="연신내역 3번 출구" data-lat="37.61862" data-lng="126.92181">
                        <span class="place-list__name">연신내역 3번 출구</span>
                        <span class="place-list__addr">은평구 불광동 308-1 · 3호선</span>
                    </a>
                    <button type="button" class="place-list__map" aria-label="연신내역 3번 출구 지도에서 보기">
                        <span class="icon icon--xs icon--map" aria-hidden="true"></span>
                    </button>
                </li>
                <li class="place-list__item">
                    <a href="pickup.html" class="place-list__text" data-dest="녹번역 3호선" data-lat="37.60081" data-lng="126.93583">
                        <span class="place-list__name">녹번역 3호선</span>
                        <span class="place-list__addr">은평구 통일로 지하 602-1</span>
                    </a>
                    <button type="button" class="place-list__map" aria-label="녹번역 3호선 지도에서 보기">
                        <span class="icon icon--xs icon--map" aria-hidden="true"></span>
                    </button>
                </li>
                <li class="place-list__item">
                    <a href="pickup.html" class="place-list__text" data-dest="은평구청" data-lat="37.60282" data-lng="126.92894">
                        <span class="place-list__name">은평구청</span>
                        <span class="place-list__addr">은평구 은평로 195</span>
                    </a>
                    <button type="button" class="place-list__map" aria-label="은평구청 지도에서 보기">
                        <span class="icon icon--xs icon--map" aria-hidden="true"></span>
                    </button>
                </li>
            </ul>
        </section>
        </div>
    </div>

    <script>
        // 목적지 고르기: 이번 호출의 목적지로 저장하고 호출 전 확인(E3b)으로
        //  출발지(집)와 같은 곳은 고를 수 없음
        function chooseDest(name, addr, lat, lng) {
            var chosen = { name: name, addr: addr, lat: Number(lat), lng: Number(lng) };
            var start = Trip.places().pickup;
            if (Math.abs(start.lat - chosen.lat) < 0.0005 && Math.abs(start.lng - chosen.lng) < 0.0005) {
                alert('지금 계신 곳이에요. 다른 목적지를 골라 주세요.');
                return;
            }
            Trip.start(chosen);
            location.href = 'confirm.html';
        }

        function addrOf(a) {
            var el = a.querySelector('.place-list__addr');
            return el ? el.textContent : '';
        }
        document.querySelectorAll('[data-dest]').forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                chooseDest(a.dataset.dest, addrOf(a), a.dataset.lat, a.dataset.lng);
            });
            // 최근 목적지의 지도 버튼도 같은 곳으로 (호출 전 확인 지도에서 보여줌)
            var mapBtn = a.parentNode.querySelector('.place-list__map');
            if (mapBtn) mapBtn.addEventListener('click', function () {
                chooseDest(a.dataset.dest, addrOf(a), a.dataset.lat, a.dataset.lng);
            });
        });

        // 장소 검색 (카카오 장소 검색 · 내 위치 가까운 곳 먼저)
        var input = document.getElementById('destination');
        var results = document.querySelector('[data-search-results]');
        var list = document.querySelector('[data-result-list]');
        var empty = document.querySelector('[data-result-empty]');
        var defaults = document.querySelector('[data-search-default]');
        var timer = null;

        function render(items) {
            list.innerHTML = '';
            empty.hidden = items.length > 0;
            items.forEach(function (place) {
                var li = document.createElement('li');
                li.className = 'place-list__item';
                var a = document.createElement('a');
                a.href = 'pickup.html';
                a.className = 'place-list__text';
                var name = document.createElement('span');
                name.className = 'place-list__name';
                name.textContent = place.place_name;
                var addr = document.createElement('span');
                addr.className = 'place-list__addr';
                addr.textContent = place.road_address_name || place.address_name;
                a.appendChild(name);
                a.appendChild(addr);
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    chooseDest(place.place_name, addr.textContent, place.y, place.x);
                });
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        function search(query) {
            MapKit.load(function () {
                var me = Trip.places().me;
                new kakao.maps.services.Places().keywordSearch(query, function (data, status) {
                    if (input.value.trim() !== query) return;
                    render(status === kakao.maps.services.Status.OK ? data : []);
                }, { location: new kakao.maps.LatLng(me.lat, me.lng), size: 10 });
            });
        }

        input.addEventListener('input', function () {
            var query = input.value.trim();
            clearTimeout(timer);
            results.hidden = !query;
            defaults.hidden = !!query;
            if (query) timer = setTimeout(function () { search(query); }, 300);
        });
    </script>
</body>
</html>
