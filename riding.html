<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 밝은·어두운 화면 둘 다 지원 (다크모드·절전모드면 앱의 어두운 색으로 · 브라우저가 색을 억지로 뒤집지 않음) -->
    <meta name="color-scheme" content="light dark">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>탑승 중 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610241259">
    <link rel="stylesheet" href="css/progress.css?v=2610241259">
    <script src="js/common.js?v=2610241259"></script>
    <script src="js/config.js?v=2610241259"></script>
    <script src="js/trip.js?v=2610241259"></script>
    <script src="js/ride-info.js?v=2610241259"></script>
    <script>
        // 탑승 시각 기록 (도착 예상·이동 완료 시각 계산에 씀)
        if (!Trip.get().boardedAt) Trip.set({ boardedAt: Date.now() });
    </script>
    <script src="js/map.js?v=2610241259"></script>
    <script src="js/push.js?v=2610241259"></script>
    <script src="js/actions.js?v=2610241259"></script>
</head>
<body>
    <div id="wrap" class="map-page" data-sheet-fit="40" data-progress-stage="riding" data-stage="riding">
        <div class="map-view" style="--map-height: 485px; --map-img-top: -121px;" data-map data-center="riding" data-route="pickup,destination">
            <img class="map-view__static" src="image/map-static.png" alt="">
            <img class="map-view__route map-view__route--long" src="image/map-route-long.svg" alt="" style="--x: 119px; --y: 181px;" data-static-pos>

            <div class="map-pin map-pin--start" data-static-pos data-place="pickup" style="--x: 64px; --y: 382px;">
                <span class="map-pin__label">
                    <span class="icon icon--xs icon--user" aria-hidden="true"></span>
                    출발
                </span>
                <span class="map-pin__stem"></span>
                <span class="map-pin__dot"></span>
            </div>
            <div class="map-pin map-pin--destination" data-static-pos data-place="destination" style="--x: 190px; --y: 102px;">
                <span class="map-pin__label" data-trip="ride-arrive-pin">도착 · 약 4분</span>
                <span class="map-pin__stem"></span>
                <span class="map-pin__dot"></span>
            </div>
            <div class="map-car map-car--riding" data-static-pos data-place="riding" data-move-path="route" data-move-range="0.3,0.95" data-move-ms="8000" style="--x: 160px; --y: 265px;">
                <img src="image/ud-taxi.png" alt="">
            </div>

            <a href="index.html" class="btn-float btn-float--back" aria-label="홈으로">
                <span class="icon icon--arrow-left" aria-hidden="true"></span>
            </a>
            <button type="button" class="btn-float btn-float--locate" aria-label="내 위치로 이동" data-locate>
                <span class="icon icon--location-current" aria-hidden="true"></span>
            </button>
        </div>

        <!-- 탑승 중 시트: 처음엔 요약·버튼까지 보이고, 올리면 운행 정보 · 기사·차량 · 보호자·콜센터 -->
        <section class="sheet sheet--riding">
            <span class="sheet__grabber" aria-hidden="true"></span>

            <!-- 요약 -->
            <div class="riding-head">
                <h1 class="assigned-title">목적지로 이동 중</h1>
                <span class="riding-head__eta" data-trip="ride-left">약 4분 남음</span>
            </div>
            <div class="riding-info">
                <p><span data-trip="dest-name">은평성모병원</span> · <span data-trip="arrive-clock">오후 3:43 도착 예상</span></p>
            </div>

            <p class="boarding-note">
                <span class="icon icon--sm icon--information" aria-hidden="true"></span>
                요금은 내릴 때 차 안에서 결제해요
            </p>

            <!-- 도움 요청 상태 줄 (요청 보낸 뒤에만 · 상태 보기 → 요청 내역) -->
            <button type="button" class="help-status" data-help-status data-action="requests" aria-haspopup="dialog" hidden>
                <span data-help-status-text>도움 요청 전송됨</span>
                <span class="help-status__more">상태 보기 ›</span>
            </button>

            <div class="btn-line-row">
                <a href="chat.html?stage=riding" class="btn-line">
                    <span class="icon icon--chat" aria-hidden="true"></span>
                    기사님과 대화
                </a>
                <button type="button" class="btn-line" aria-haspopup="dialog" data-action="help">
                    <img class="icon-img icon-img--22" src="image/help-octagon.svg" alt="">
                    <span data-help-label>도움 요청</span>
                </button>
            </div>

            <!-- 운행 정보 -->
            <div class="riding-section" aria-labelledby="riding-route-title">
                <h2 class="riding-section__title" id="riding-route-title">운행 정보</h2>
                <ul class="route-list">
                    <li class="route-list__item">
                        <img src="image/route-dot-start.svg" alt="">
                        <span class="route-list__label">출발</span>
                        <span class="route-list__place" data-trip="pickup-name">래미안베라힐즈 정문</span>
                    </li>
                    <li class="route-list__item">
                        <img src="image/route-dot-end.svg" alt="">
                        <span class="route-list__label">도착</span>
                        <span class="route-list__place" data-trip="dest-name">은평성모병원</span>
                    </li>
                    <li class="route-list__line" role="presentation"><img src="image/route-line.svg" alt=""></li>
                </ul>
                <dl class="riding-rows">
                    <div class="riding-rows__row"><dt>탑승 시각</dt><dd data-trip="board-clock">오후 2:20</dd></div>
                    <div class="riding-rows__row"><dt>도착 예정</dt><dd data-trip="arrive-at">오후 2:34</dd></div>
                    <div class="riding-rows__row"><dt>이동 거리</dt><dd data-trip="ride-dist">4.5km</dd></div>
                    <div class="riding-rows__row"><dt>예상 요금</dt><dd data-trip="ride-fare">약 1,500원</dd></div>
                </dl>
                <ul class="tag-list" aria-label="함께 전달된 정보" data-ride-tags>
                    <li class="tag" data-trip="riders">본인 + 동승자 1명</li>
                    <li class="tag tag--warning">탑승 정보 미등록</li>
                </ul>
            </div>

            <!-- 기사·차량 -->
            <div class="riding-section" aria-labelledby="riding-driver-title">
                <h2 class="riding-section__title" id="riding-driver-title">기사님·차량</h2>
                <div class="driver-card">
                    <img class="driver-card__photo" src="image/driver.png" alt="">
                    <div class="driver-card__text">
                        <p class="driver-card__plate">33바 5521</p>
                        <p class="driver-card__info">강민준 기사님 · 흰색 PV5</p>
                    </div>
                    <img class="driver-card__car" src="image/pv5-side.png" alt="">
                </div>
                <button type="button" class="btn-line" data-action="call-driver">
                    <span class="icon icon--phone" aria-hidden="true"></span>
                    기사님께 전화하기
                </button>
            </div>

            <!-- 보호자 · 콜센터 -->
            <div class="riding-section" aria-labelledby="riding-share-title">
                <h2 class="riding-section__title" id="riding-share-title">함께 확인하기</h2>
                <!-- "이동 알림 받기"를 허용한 연결된 보호자가 있을 때만 (없으면 숨김) -->
                <p class="riding-guardian" data-guardian-notice hidden></p>
                <div class="btn-row">
                    <button type="button" class="btn btn--outline" data-action="share" aria-haspopup="dialog">보호자에게 알리기</button>
                    <button type="button" class="btn btn--outline" data-action="call-center">콜센터 문의</button>
                </div>
            </div>
        </section>

        <script>
            // 함께 전달된 정보: 접수할 때 담은 탑승 정보 (없으면 지금 저장된 탑승 정보 · 그것도 없으면 예시 그대로)
            (function () {
                var tags = Trip.get().ride || (window.RideInfo && RideInfo.tags());
                if (!tags) return;
                var box = document.querySelector('[data-ride-tags]');
                var riders = box.querySelector('[data-trip="riders"]');
                box.innerHTML = '';
                box.appendChild(riders);
                tags.forEach(function (tag) {
                    var li = document.createElement('li');
                    li.className = 'tag' + (tag.tone ? ' tag--' + tag.tone : '');
                    li.textContent = tag.text;
                    box.appendChild(li);
                });
            })();
        </script>
    </div>
</body>
</html>
