<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 밝은·어두운 화면 둘 다 지원 (다크모드·절전모드면 앱의 어두운 색으로 · 브라우저가 색을 억지로 뒤집지 않음) -->
    <meta name="color-scheme" content="light dark">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>음성으로 부르기 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610231604">
    <link rel="stylesheet" href="css/voice.css?v=2610231604">
    <script src="js/common.js?v=2610231604"></script>
    <script src="js/config.js?v=2610231604"></script>
    <script src="js/trip.js?v=2610231604"></script>
    <script src="js/map.js?v=2610231604"></script>
    <script src="js/places.js?v=2610231604"></script>
    <script src="js/ride-info.js?v=2610231604"></script>
    <script src="js/stats.js?v=2610231604"></script>
</head>
<body>
    <div id="wrap" class="voice-page">
        <!-- 말로하기_v17_A_듣는중 -->
        <section class="voice-listen" data-voice-step="listen">
            <div class="voice-listen__body">
                <h1 class="voice-listen__title" data-voice-title>어디로 갈까요?</h1>
                <p class="voice-listen__desc" data-voice-desc aria-live="polite">가운데 마이크를 누르고 말씀해 주세요.</p>
                <!-- 키보드로 입력 (키보드 버튼을 누르면 열림 · 휴대폰 키보드가 올라옴) -->
                <form class="voice-type" data-voice-type hidden>
                    <label for="voice-text" class="blind">어디로 갈지 입력</label>
                    <input type="text" id="voice-text" class="voice-type__input" placeholder="예: 은평성모병원" autocomplete="off" enterkeyhint="go">
                    <button type="submit" class="voice-type__send">확인</button>
                </form>
                <p class="voice-listen__heard" data-voice-heard aria-live="polite" hidden></p>
                <div class="voice-examples" data-voice-examples>
                    <p class="blind">이렇게 말해 보세요 (눌러도 돼요)</p>
                    <button type="button" class="voice-example">"은평성모병원으로 지금 불러줘"</button>
                    <button type="button" class="voice-example">"녹번역 가는 차"</button>
                    <button type="button" class="voice-example">"내일 10시 병원"</button>
                    <button type="button" class="voice-example">"차 어디쯤 왔어?"</button>
                </div>
            </div>

            <div class="voice-controls">
                <div class="voice-controls__item">
                    <button type="button" class="voice-round" aria-label="키보드로 입력하기" aria-pressed="false" data-voice-keyboard>
                        <span class="icon icon--keyboard" aria-hidden="true"></span>
                    </button>
                    <span class="voice-controls__label">키보드</span>
                </div>
                <div class="voice-controls__item">
                    <button type="button" class="voice-mic" data-voice-mic aria-pressed="false" aria-label="말하기">
                        <span class="icon icon--microphone" aria-hidden="true"></span>
                    </button>
                    <span class="voice-controls__label voice-controls__label--mic" data-voice-mic-label>눌러서 말하기</span>
                </div>
                <div class="voice-controls__item">
                    <a href="index.html" class="voice-round" data-history-back aria-label="닫기">
                        <span class="icon icon--close" aria-hidden="true"></span>
                    </a>
                    <span class="voice-controls__label">닫기</span>
                </div>
            </div>
        </section>

        <!-- 말로하기_v17_B_확인 -->
        <section class="voice-confirm" data-voice-step="confirm" hidden>
            <div class="voice-confirm__top">
                <button type="button" class="voice-round voice-round--sm" data-voice-close aria-label="닫기">
                    <span class="icon icon--close" aria-hidden="true"></span>
                </button>
            </div>
            <div class="voice-confirm__heard">
                <p class="voice-confirm__heard-label">이렇게 들었어요</p>
                <p class="voice-confirm__heard-text" data-confirm-heard></p>
            </div>
            <div class="voice-confirm__card">
                <h1 class="voice-confirm__question" data-confirm-question></h1>
                <p class="voice-confirm__sub" data-confirm-sub></p>
                <button type="button" class="btn btn--primary voice-confirm__yes" data-confirm-yes>네, 부르기</button>
                <button type="button" class="btn btn--outline" data-confirm-no>아니요, 다시 말할게요</button>
            </div>
            <!-- 말로 대답 받는 상태 (읽어 주는 중 · 듣는 중 · 못 알아들음) -->
            <div class="voice-hear" data-voice-hear role="status" aria-live="polite" hidden>
                <span class="voice-hear__dot" aria-hidden="true"></span>
                <p class="voice-hear__text" data-hear-text></p>
                <button type="button" class="voice-hear__again" data-hear-again hidden>다시 듣기</button>
            </div>
            <p class="voice-confirm__note">
                <span class="icon icon--speak" aria-hidden="true"></span>
                질문을 소리로도 읽어드려요. "네"라고 말하면 바로 부르고, "아니요"라고 말하면 다시 들어요.
            </p>
            <a href="search.html" class="voice-confirm__edit" data-confirm-edit>목적지를 글자로 고치기</a>
        </section>

        <!-- C · 부르기 전 확인 (함께 타는 분 · 탑승 정보 · 연락 방법) -->
        <section class="voice-confirm" data-voice-step="check" hidden>
            <div class="voice-confirm__top voice-confirm__top--back">
                <button type="button" class="voice-round voice-round--sm" data-check-back aria-label="목적지 확인으로 돌아가기">
                    <span class="icon icon--arrow-left" aria-hidden="true"></span>
                </button>
            </div>
            <div class="voice-confirm__card">
                <h1 class="voice-confirm__question" tabindex="-1" data-check-title>이대로 부를까요?</h1>
                <p class="voice-confirm__sub" data-check-route></p>
                <dl class="voice-check">
                    <div class="voice-check__row">
                        <dt class="voice-check__label" id="check-riders">함께 타는 분</dt>
                        <dd class="voice-riders" role="radiogroup" aria-labelledby="check-riders">
                            <button type="button" class="voice-riders__btn" role="radio" data-riders="0">없어요</button>
                            <button type="button" class="voice-riders__btn" role="radio" data-riders="1">1명</button>
                            <button type="button" class="voice-riders__btn" role="radio" data-riders="2">2명</button>
                        </dd>
                    </div>
                    <div class="voice-check__row">
                        <dt class="voice-check__label">탑승 정보 · 기사님께 전달</dt>
                        <dd class="voice-check__value" data-check-ride></dd>
                    </div>
                    <div class="voice-check__row">
                        <dt class="voice-check__label">연락 방법</dt>
                        <dd class="voice-check__value" data-check-contact></dd>
                    </div>
                </dl>
                <button type="button" class="btn btn--primary voice-confirm__yes" data-check-yes>이대로 부르기</button>
                <button type="button" class="btn btn--outline" data-check-edit>정보 바꾸고 부르기</button>
            </div>
            <!-- 말로 대답 받는 상태 (읽어 주는 중 · 듣는 중 · 못 알아들음) -->
            <div class="voice-hear" data-voice-hear role="status" aria-live="polite" hidden>
                <span class="voice-hear__dot" aria-hidden="true"></span>
                <p class="voice-hear__text" data-hear-text></p>
                <button type="button" class="voice-hear__again" data-hear-again hidden>다시 듣기</button>
            </div>
            <p class="voice-confirm__note" data-check-note>
                <span class="icon icon--speak" aria-hidden="true"></span>
                "네"라고 말하면 부르고, "바꿀게요"라고 말하면 정보를 바꾸는 화면으로 가요. 함께 타는 분이 있으면 "한 명"처럼 말해 주세요.
            </p>
        </section>
    </div>

    <script src="js/voice.js?v=2610231604"></script>
</body>
</html>
