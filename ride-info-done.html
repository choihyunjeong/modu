<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 밝은·어두운 화면 둘 다 지원 (다크모드·절전모드면 앱의 어두운 색으로 · 브라우저가 색을 억지로 뒤집지 않음) -->
    <meta name="color-scheme" content="light dark">
    <!-- 웹앱(PWA) · 홈 화면에 추가하면 앱처럼 열림 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="image/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="모두의 이동">
    <title>탑승 정보 저장 완료 | 모두의 이동</title>
    <link rel="stylesheet" href="css/common.css?v=2610241218">
    <link rel="stylesheet" href="css/ride-info.css?v=2610241218">
    <script src="js/common.js?v=2610241218"></script>
    <!-- 여기 닿아야 등록한 탑승 정보가 진짜로 저장됨 -->
    <script src="js/ride-info.js?v=2610241218"></script>
</head>
<body>
    <div id="wrap">
        <header class="app-header">
            <a href="ride-info-contact.html" class="app-header__back" data-history-back aria-label="뒤로">
                <span class="icon icon--chevron-left" aria-hidden="true"></span>
            </a>
            <h1 class="app-header__title">탑승 정보 등록</h1>
            <span class="app-header__blank" aria-hidden="true"></span>
        </header>

        <main class="content content--sub">
            <div class="done-mark">
                <span class="icon icon--lg icon--checkmark" aria-hidden="true"></span>
            </div>

            <div class="page-title">
                <h2 class="page-title__heading">탑승 정보를 저장했어요</h2>
                <p class="page-title__desc">탑승 정보는 차량을 찾고 확인할 때 함께 전달돼요.</p>
            </div>

            <dl class="card info-list">
                <div class="info-list__row">
                    <dt>탑승 방식</dt>
                    <dd data-done="device">등록하지 않았어요</dd>
                </div>
                <div class="info-list__row" data-done-row="requests" hidden>
                    <dt>미리 전할 요청</dt>
                    <dd data-done="requests"></dd>
                </div>
                <div class="info-list__row">
                    <dt>연락</dt>
                    <dd data-done="contact">정하지 않았어요</dd>
                </div>
                <div class="info-list__row" data-done-row="condition" hidden>
                    <dt>탑승 조건</dt>
                    <dd data-done="condition"></dd>
                </div>
            </dl>

            <p class="done-note">이 상태는 기사님께도 함께 전달돼요. 실제로 탄 결과는 다음 접수에 참고해요.</p>

            <p class="guardian-hint">
                보호자도 연결할 수 있어요 ·
                <a href="guardian.html" class="guardian-hint__link">
                    연결하기
                    <span class="icon icon--xs icon--chevron-right" aria-hidden="true"></span>
                </a>
            </p>
        </main>

        <div class="bottom-action">
            <a href="index.html" class="btn btn--primary">홈으로</a>
        </div>
    </div>
    <script>
        // 방금 저장한 탑승 정보를 그대로 보여 줌
        (function () {
            var ride = RideInfo.describe() || {};
            var condition = RideInfo.condition();
            function put(key, text) {
                var el = document.querySelector('[data-done="' + key + '"]');
                if (text) el.textContent = text;
                var row = document.querySelector('[data-done-row="' + key + '"]');
                if (row) row.hidden = !text;
            }
            put('device', ride.device);
            put('requests', ride.requests && ride.requests.replace(/^미리 전할 요청 · /, ''));
            put('contact', ride.contact);
            put('condition', condition);
        })();
    </script>
</body>
</html>
